server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  sync_period: 10s
  filename: /tmp/positions.yaml

clients:
  - url: "http://213.171.27.217:3100/loki/api/v1/push"

scrape_configs:
  - job_name: 24alert-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["24alert-*"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/24alert-(.*)"
        target_label: "service"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - target_label: "job"
        replacement: "24alert"
      - target_label: "project"
        replacement: "24alert"
    pipeline_stages:
      - docker: {}
