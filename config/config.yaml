# 24Alert Trading Bot Configuration

# T-Invest API configuration
tinvest:
  # Determined by TINVEST_SANDBOX env var (true → sandbox, false → production)
  # Do NOT hardcode here; the code selects the correct endpoint automatically.
  endpoint: ""
  
  # Token from environment variable: TINVEST_TOKEN
  # token set via env var (DO NOT commit real token!)
  
  # Max retries for transient failures
  max_retries: 3
  
  # Automatic retry on rate limit (ResourceExhausted)
  disable_resource_exhausted_retry: false
  
  # Default timeout for API calls (seconds)
  call_timeout_sec: 30
  
  # Sandbox-specific: account ID for testing
  sandbox_account_id: ""

# Service ports
services:
  order_port: 9001
  marketdata_port: 9002
  portfolio_port: 9003
  risk_port: 9004
  gateway_port: 8080

# Risk management
risk:
  # Max position size in lots per instrument
  max_position_lots: 10
  
  # Circuit breaker: number of consecutive failures before halt
  circuit_breaker_threshold: 5
  
  # Circuit breaker cooldown duration (Go duration format: "5m", "1h")
  circuit_breaker_cooldown: "5m"
  
  # Margin call threshold (percentage of initial margin)
  margin_call_threshold_percent: 80
  
  # Check trading session before order placement
  check_trading_session: true

# Logging configuration
logging:
  # Level: debug, info, warn, error
  level: "info"
  
  # Format: json (recommended for production)
  format: "json"
  
  # Output: stdout, file, both
  output: "stdout"
  
  # File path (if output includes file)
  file_path: "logs/24alert.log"
  
  # Include correlation IDs in logs
  include_correlation_id: true

# Metrics (Prometheus)
metrics:
  # Enable Prometheus metrics
  enabled: true
  
  # Metrics endpoint path (usually /metrics)
  endpoint: "/metrics"
  
  # Include detailed histograms (may increase memory usage)
  detailed_histograms: false

# Rate limiting configuration (per method, requests per minute)
rate_limits:
  # Order service
  post_order: 900        # 15 req/sec * 60
  post_order_async: 600
  cancel_order: 100
  replace_order: 100
  get_orders: 200
  get_order_state: 100
  post_stop_order: 50
  cancel_stop_order: 50
  get_stop_orders: 60
  
  # Market data service
  get_candles: 600
  get_orderbook: 600
  get_last_prices: 600
  get_close_prices: 600
  get_history: 30        # Bottleneck: 30 req/min
  get_trading_status: 600
  
  # Portfolio service
  get_positions: 200
  get_portfolio: 200
  get_withdraw_limits: 200
  get_operations: 200
  get_accounts: 200
  get_margin_attributes: 200

# Market data streaming
market_data_stream:
  # Max concurrent subscriptions per stream
  max_subscriptions: 300
  
  # Number of concurrent streams (careful: 32 total limit from T-Invest)
  max_concurrent_streams: 4
  
  # Reconnect strategy on stream failure
  reconnect_delay_ms: 1000
  max_reconnect_attempts: 10

# Strategy plugin configuration
strategy:
  # gRPC endpoint for external strategy service
  # Example: "localhost:9010"
  endpoint: "localhost:9010"
  
  # Timeout for strategy evaluation (milliseconds)
  evaluation_timeout_ms: 1000
  
  # Initial configuration (strategy-specific)
  config: {}

# Strategy runner (optional): separate process, candles → signals → risk → orders
strategies:
  runner_port: 9020
  metrics_port: 9120
  evaluation_timeout_ms: 1000
  journal_path: "data/strategy_journal.db"
  trading_schedule:
    timezone: "Europe/Moscow"
    sessions:
      - name: "forts_day_before_clearing"
        start: "10:00"
        end: "14:00"
      - name: "forts_day_after_clearing"
        start: "14:05"
        end: "18:50"
      - name: "forts_evening"
        start: "19:00"
        end: "23:50"
  watchdog:
    enabled: true
    check_interval_sec: 60
    max_drawdown_percent: 10
    max_daily_loss_rub: 500
    pause_on_drawdown: true
    stuck_order_minutes: 30
  notifications:
    telegram:
      bot_token: ""
      chat_id: ""
  instances:
    - id: fut-brent-mini-lb
      type: sma_crossover
      account_id: "2001673385"
      instruments:
        - "dc1ffa30-70a4-4a7b-807a-4f31c2951f7e"   # BMM6 BRM-6.26 Brent mini
      # SAFETY HOLD 2026-05-18: disabled until broker-side stops / flatten watchdog are implemented.
      enabled: false
      params:
        interval: "1h"
        fast_period: "4"
        slow_period: "9"
        trailing_stop_pct: "0.005"
        quantity: "1"
    - id: fut-gas-mini-sma
      type: sma_crossover
      account_id: "2001673385"
      instruments:
        - "117a1408-431f-4ba0-a041-5bba3123d4a8"   # NGM6 NG-6.26 Gas
      # SAFETY HOLD 2026-05-18: disabled until broker-side stops / flatten watchdog are implemented.
      enabled: false
      params:
        interval: "1h"
        fast_period: "5"
        slow_period: "17"
        trailing_stop_pct: "0.005"
        quantity: "1"
    - id: fut-mechel-lb
      type: sma_crossover
      account_id: "2001673385"
      instruments:
        - "6f4563c0-e853-46f2-98c7-3abce3cc7517"   # MCM6 MTLR-6.26 Mechel
      # SAFETY HOLD 2026-05-18: disabled until broker-side stops / flatten watchdog are implemented.
      enabled: false
      params:
        interval: "1h"
        fast_period: "4"
        slow_period: "9"
        trailing_stop_pct: "0.005"
        quantity: "1"

# Redis (candle cache)
redis:
  addr: "redis:6379"
  password: ""
  db: 0

# Feature flags
features:
  # Enable order intent validation through risk service
  enable_risk_validation: true
  
  # Enable order journaling (for audit trail)
  enable_order_journal: true
  
  # Enable market data caching
  enable_md_cache: true
