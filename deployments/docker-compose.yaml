services:
  order-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: order-svc
    container_name: 24alert-order-svc
    ports:
      - "127.0.0.1:9001:9001"
    expose:
      - "9101"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  marketdata-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: marketdata-svc
    container_name: 24alert-marketdata-svc
    ports:
      - "127.0.0.1:9002:9002"
    expose:
      - "9102"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9002 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  portfolio-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: portfolio-svc
    container_name: 24alert-portfolio-svc
    ports:
      - "127.0.0.1:9003:9003"
    expose:
      - "9103"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  risk-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: risk-svc
    container_name: 24alert-risk-svc
    ports:
      - "127.0.0.1:9004:9004"
    expose:
      - "9104"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      portfolio-svc:
        condition: service_healthy
      marketdata-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9004 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: 24alert-gateway
    # Host loopback only: matches nginx upstream 127.0.0.1:18080 (see docs/STREAM_ORDERBOOK.md).
    # Other containers reach gateway at http://gateway:8080 or http://24alert-gateway:8080 on trading-bot-net.
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      order-svc:
        condition: service_healthy
      marketdata-svc:
        condition: service_healthy
      portfolio-svc:
        condition: service_healthy
      risk-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: 24alert-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  strategy-runner:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: strategy-runner
    container_name: 24alert-strategy-runner
    ports:
      - "127.0.0.1:9020:9020"
      - "127.0.0.1:9120:9120"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_ADDR=redis:6379
    volumes:
      - ../config/config.yaml:/app/config/config.yaml
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-scanner:
    build:
      context: ..
      dockerfile: deployments/ai-scanner/Dockerfile
    container_name: 24alert-ai-scanner
    env_file:
      - .env
    environment:
      - CURSOR_API_KEY=${CURSOR_API_KEY}
      - MCP_MARKET_BEARER=${MCP_MARKET_BEARER}
      - MCP_24ALERT_BEARER=${MCP_24ALERT_BEARER}
      - MCP_VAULT_BEARER=${MCP_VAULT_BEARER}
      - SCAN_POSTMARKET_CRON=${SCAN_POSTMARKET_CRON:-50 18 * * 1-5}
      - SCAN_PREMARKET_CRON=${SCAN_PREMARKET_CRON:-50 9 * * 1-5}
      - SCAN_HEALTH_CRON=${SCAN_HEALTH_CRON:-0 */4 * * *}
      - STRATEGY_RUNNER_URL=http://strategy-runner:9020
      - GATEWAY_URL=http://gateway:8080
    volumes:
      - ./ai-scanner/workspace/.cursor:/workspace/.cursor:ro
      - ./ai-scanner/workspace/system-prompt.md:/workspace/system-prompt.md:ro
      - ./ai-scanner/run-scan.sh:/etc/scanner/run-scan.sh:ro
      - ../scripts/ai-scanner:/opt/ai-scanner:ro
      - ../config/config.yaml:/app/config/config.yaml
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      strategy-runner:
        condition: service_started
    profiles:
      - ai-scanner
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ln -sf /usr/share/zoneinfo/Europe/Moscow /etc/localtime
        echo "Europe/Moscow" > /etc/timezone
        umask 077
        cat > /run/ai-scanner-env.sh <<ENVEOF
        export HOME=/root
        export PATH="/root/.local/bin:$${PATH}"
        export CURSOR_API_KEY="$${CURSOR_API_KEY}"
        export MCP_MARKET_BEARER="$${MCP_MARKET_BEARER}"
        export MCP_24ALERT_BEARER="$${MCP_24ALERT_BEARER}"
        export MCP_VAULT_BEARER="$${MCP_VAULT_BEARER}"
        export STRATEGY_RUNNER_URL="$${STRATEGY_RUNNER_URL}"
        export GATEWAY_URL="$${GATEWAY_URL}"
        ENVEOF
        chmod 600 /run/ai-scanner-env.sh
        cp /etc/scanner/run-scan.sh /usr/local/bin/run-scan.sh
        chmod +x /usr/local/bin/run-scan.sh
        printf '%s root . /run/ai-scanner-env.sh; /usr/local/bin/run-scan.sh post-market >> /proc/1/fd/1 2>&1\n' "$${SCAN_POSTMARKET_CRON}" > /etc/cron.d/ai-scanner
        printf '%s root . /run/ai-scanner-env.sh; /usr/local/bin/run-scan.sh pre-market >> /proc/1/fd/1 2>&1\n' "$${SCAN_PREMARKET_CRON}" >> /etc/cron.d/ai-scanner
        printf '%s root . /run/ai-scanner-env.sh; /usr/local/bin/run-scan.sh health >> /proc/1/fd/1 2>&1\n' "$${SCAN_HEALTH_CRON}" >> /etc/cron.d/ai-scanner
        printf '\n' >> /etc/cron.d/ai-scanner
        chmod 644 /etc/cron.d/ai-scanner
        echo "=== crontab ==="
        cat /etc/cron.d/ai-scanner
        echo "=== ai-scanner ready ==="
        exec /usr/sbin/cron -f

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: 24alert-prometheus-agent
    command:
      - "--agent"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.agent.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../config/prometheus-agent.yaml:/etc/prometheus/prometheus.yml:ro
      - ../config/remote_write_password:/etc/prometheus/remote_write_password:ro
      - prometheus-data:/prometheus
    networks:
      - trading-bot-net
    restart: unless-stopped
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:3.5.0
    container_name: 24alert-promtail
    volumes:
      - ../config/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - trading-bot-net
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  trading-bot-net:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
