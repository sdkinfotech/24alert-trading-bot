services:
  order-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: order-svc
    container_name: 24alert-order-svc
    ports:
      - "127.0.0.1:9001:9001"
    expose:
      - "9101"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  marketdata-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: marketdata-svc
    container_name: 24alert-marketdata-svc
    ports:
      - "127.0.0.1:9002:9002"
    expose:
      - "9102"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9002 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  portfolio-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: portfolio-svc
    container_name: 24alert-portfolio-svc
    ports:
      - "127.0.0.1:9003:9003"
    expose:
      - "9103"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  risk-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: risk-svc
    container_name: 24alert-risk-svc
    ports:
      - "127.0.0.1:9004:9004"
    expose:
      - "9104"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      portfolio-svc:
        condition: service_healthy
      marketdata-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9004 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: 24alert-gateway
    # Host loopback only: matches nginx upstream 127.0.0.1:18080 (see docs/STREAM_ORDERBOOK.md).
    # Other containers reach gateway at http://gateway:8080 or http://24alert-gateway:8080 on trading-bot-net.
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      order-svc:
        condition: service_healthy
      marketdata-svc:
        condition: service_healthy
      portfolio-svc:
        condition: service_healthy
      risk-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: 24alert-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  strategy-runner:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: strategy-runner
    container_name: 24alert-strategy-runner
    ports:
      - "127.0.0.1:9020:9020"
      - "127.0.0.1:9120:9120"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_ADDR=redis:6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-anthropic/claude-sonnet-4}
      - AI_TRADER_MODEL=${AI_TRADER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - AI_TRADER_MODEL_FALLBACKS=${AI_TRADER_MODEL_FALLBACKS:-google/gemma-4-31b-it:free}
      - AI_TRADER_LLM_INTERVAL_SEC=${AI_TRADER_LLM_INTERVAL_SEC:-90}
      - AI_TRADER_ARMED_LIVE=${AI_TRADER_ARMED_LIVE:-true}
      - AI_TRADER_TRADING_MIN_REPORT_TF=${AI_TRADER_TRADING_MIN_REPORT_TF:-5m}
      - AI_TRADER_RECORD_ENABLED=${AI_TRADER_RECORD_ENABLED:-true}
      - AI_TRADER_RECORD_DB=${AI_TRADER_RECORD_DB:-/app/data/ai_trader_record.db}
      - AI_TRADER_STREAM_BOOK=${AI_TRADER_STREAM_BOOK:-true}
      - AI_TRADER_PAPER_COMMISSION_BPS=${AI_TRADER_PAPER_COMMISSION_BPS:-4}
      - AI_TRADER_PAPER_SLIPPAGE_BPS=${AI_TRADER_PAPER_SLIPPAGE_BPS:-1}
      - GATEWAY_URL=http://24alert-gateway:8080
      - ADVISOR_URL=http://24alert-advisor-svc:9030
    volumes:
      - ../config/config.yaml:/app/config/config.yaml
      - strategy-data:/app/data
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  advisor-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: advisor-svc
    container_name: 24alert-advisor-svc
    ports:
      - "127.0.0.1:9030:9030"
      - "127.0.0.1:9130:9130"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ADVISOR_MODEL=${ADVISOR_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - ADVISOR_MODEL_FALLBACKS=${ADVISOR_MODEL_FALLBACKS:-google/gemma-4-31b-it:free}
      # Last resort after free models + retries (5m/rollup reports)
      - ADVISOR_PAID_MODEL=${ADVISOR_PAID_MODEL:-google/gemini-2.5-flash}
      - ADVISOR_LLM_RETRIES=${ADVISOR_LLM_RETRIES:-2}
      - ADVISOR_LLM_MAX_TOKENS=${ADVISOR_LLM_MAX_TOKENS:-4096}
      - ADVISOR_FACTS_FALLBACK=${ADVISOR_FACTS_FALLBACK:-true}
      - ADVISOR_DB_PATH=/app/data/advisor_memory.db
      - STRATEGY_RUNNER_URL=http://24alert-strategy-runner:9020
    volumes:
      - strategy-data:/app/data
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      strategy-runner:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9030/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai-scanner:
    build:
      context: ..
      dockerfile: deployments/ai-scanner/Dockerfile
    container_name: 24alert-ai-scanner
    env_file:
      - .env
    environment:
      - CURSOR_API_KEY=${CURSOR_API_KEY}
      - AI_SCANNER_MODEL=${AI_SCANNER_MODEL:-composer-2}
      - AI_SCANNER_MAX_CONTRACT_PRICE=${AI_SCANNER_MAX_CONTRACT_PRICE:-10000}
      - SCAN_POSTMARKET_CRON=${SCAN_POSTMARKET_CRON:-0 2 * * 2-6}
      - SCAN_PREMARKET_CRON=${SCAN_PREMARKET_CRON:-50 9 * * 1-5}
      - SCAN_HEALTH_CRON=${SCAN_HEALTH_CRON:-0 */4 * * *}
      - STRATEGY_RUNNER_URL=http://24alert-strategy-runner:9020
      - GATEWAY_URL=http://gateway:8080
    volumes:
      - ./ai-scanner/workspace/.cursor:/workspace/.cursor:ro
      - ./ai-scanner/workspace/system-prompt.md:/workspace/system-prompt.md:ro
      - ./ai-scanner/workspace/reference:/workspace/reference:ro
      - ai-scanner-memory:/workspace/memory
      - ai-scanner-reports:/workspace/reports
      - ai-scanner-metrics:/workspace/metrics
      - ./ai-scanner/run-scan.sh:/etc/scanner/run-scan.sh:ro
      - ./ai-scanner/metrics-server.py:/etc/scanner/metrics-server.py:ro
      - ../scripts/ai-scanner:/opt/ai-scanner:ro
      - ../scripts/monitoring/strategy_dashboard_smoke.py:/usr/local/bin/strategy_dashboard_smoke.py:ro
      - ../monitoring/dashboards/24alert-strategy-runner.json:/workspace/24alert-strategy-runner.json:ro
      - ../config/config.yaml:/app/config/config.yaml
    expose:
      - "9130"
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      strategy-runner:
        condition: service_started
    profiles:
      - ai-scanner
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ln -sf /usr/share/zoneinfo/Europe/Moscow /etc/localtime
        echo "Europe/Moscow" > /etc/timezone
        umask 077
        mkdir -p /workspace/memory /workspace/reports /workspace/metrics
        if [ ! -s /workspace/memory/agent-memory.md ]; then
          cp /workspace/reference/agent-memory.seed.md /workspace/memory/agent-memory.md
        fi
        python3 /etc/scanner/metrics-server.py &
        cat > /run/ai-scanner-env.sh <<ENVEOF
        export HOME=/root
        export PATH="/root/.local/bin:$${PATH}"
        export CURSOR_API_KEY="$${CURSOR_API_KEY}"
        export AI_SCANNER_MODEL="$${AI_SCANNER_MODEL}"
        export AI_SCANNER_MAX_CONTRACT_PRICE="$${AI_SCANNER_MAX_CONTRACT_PRICE}"
        export STRATEGY_RUNNER_URL="$${STRATEGY_RUNNER_URL}"
        export GATEWAY_URL="$${GATEWAY_URL}"
        ENVEOF
        chmod 600 /run/ai-scanner-env.sh
        cp /etc/scanner/run-scan.sh /usr/local/bin/run-scan.sh
        chmod +x /usr/local/bin/run-scan.sh
        printf '%s root . /run/ai-scanner-env.sh; /usr/local/bin/run-scan.sh post-market >> /proc/1/fd/1 2>&1\n' "$${SCAN_POSTMARKET_CRON}" > /etc/cron.d/ai-scanner
        printf '%s root . /run/ai-scanner-env.sh; /usr/local/bin/run-scan.sh pre-market >> /proc/1/fd/1 2>&1\n' "$${SCAN_PREMARKET_CRON}" >> /etc/cron.d/ai-scanner
        printf '%s root . /run/ai-scanner-env.sh; /usr/local/bin/run-scan.sh health >> /proc/1/fd/1 2>&1\n' "$${SCAN_HEALTH_CRON}" >> /etc/cron.d/ai-scanner
        printf '\n' >> /etc/cron.d/ai-scanner
        chmod 644 /etc/cron.d/ai-scanner
        echo "=== crontab ==="
        cat /etc/cron.d/ai-scanner
        echo "=== ai-scanner ready ==="
        exec /usr/sbin/cron -f

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: 24alert-prometheus-agent
    command:
      - "--agent"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.agent.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../config/prometheus-agent.yaml:/etc/prometheus/prometheus.yml:ro
      - ../config/remote_write_password:/etc/prometheus/remote_write_password:ro
      - prometheus-data:/prometheus
    networks:
      - trading-bot-net
    restart: unless-stopped
    profiles:
      - monitoring

  ops-exporter:
    image: python:3.12-alpine
    container_name: 24alert-ops-exporter
    command: ["python", "/opt/ops-exporter/ops-exporter.py"]
    volumes:
      - ./ops-exporter/ops-exporter.py:/opt/ops-exporter/ops-exporter.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      - ../.git:/repo/.git:ro
    expose:
      - "9140"
    networks:
      - trading-bot-net
    restart: unless-stopped
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:3.5.0
    container_name: 24alert-promtail
    volumes:
      - ../config/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - trading-bot-net
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  # External fixed name: same network regardless of `docker compose -p` (deployments vs 24alert).
  # Create once: docker network create 24alert-trading-bot-net  (see scripts/ensure-docker-network.sh)
  trading-bot-net:
    name: 24alert-trading-bot-net
    external: true

volumes:
  redis-data:
  prometheus-data:
  strategy-data:
  ai-scanner-memory:
  ai-scanner-reports:
  ai-scanner-metrics:
