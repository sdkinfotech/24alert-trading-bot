services:
  order-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: order-svc
    container_name: 24alert-order-svc
    ports:
      - "127.0.0.1:9001:9001"
    expose:
      - "9101"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  marketdata-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: marketdata-svc
    container_name: 24alert-marketdata-svc
    ports:
      - "127.0.0.1:9002:9002"
    expose:
      - "9102"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9002 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  portfolio-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: portfolio-svc
    container_name: 24alert-portfolio-svc
    ports:
      - "127.0.0.1:9003:9003"
    expose:
      - "9103"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  risk-svc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: risk-svc
    container_name: 24alert-risk-svc
    ports:
      - "127.0.0.1:9004:9004"
    expose:
      - "9104"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      portfolio-svc:
        condition: service_healthy
      marketdata-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9004 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: 24alert-gateway
    # Host loopback only: matches nginx upstream 127.0.0.1:18080 (see docs/STREAM_ORDERBOOK.md).
    # Other containers reach gateway at http://gateway:8080 or http://24alert-gateway:8080 on trading-bot-net.
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - .env
    environment:
      - TINVEST_SANDBOX=${TINVEST_SANDBOX:-true}
      - TINVEST_SANDBOX_TOKEN=${TINVEST_SANDBOX_TOKEN}
      - TINVEST_PROD_TOKEN=${TINVEST_PROD_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trading-bot-net
    restart: unless-stopped
    depends_on:
      order-svc:
        condition: service_healthy
      marketdata-svc:
        condition: service_healthy
      portfolio-svc:
        condition: service_healthy
      risk-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: 24alert-prometheus-agent
    command:
      - "--agent"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.agent.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../config/prometheus-agent.yaml:/etc/prometheus/prometheus.yml:ro
      - ../config/remote_write_password:/etc/prometheus/remote_write_password:ro
      - prometheus-data:/prometheus
    networks:
      - trading-bot-net
    restart: unless-stopped
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:3.5.0
    container_name: 24alert-promtail
    volumes:
      - ../config/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - trading-bot-net
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  trading-bot-net:
    driver: bridge

volumes:
  prometheus-data:
