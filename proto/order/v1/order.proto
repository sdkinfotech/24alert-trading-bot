syntax = "proto3";

package github.com.24alert.trading.order.v1;

option go_package = "github.com/24alert/trading-bot/gen/go/order/v1";

import "common/v1/types.proto";

service OrderService {
  rpc PostOrder(PostOrderRequest) returns (PostOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc ReplaceOrder(ReplaceOrderRequest) returns (PostOrderResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
  rpc GetOrderState(GetOrderStateRequest) returns (OrderState);
  rpc PostStopOrder(PostStopOrderRequest) returns (PostStopOrderResponse);
  rpc CancelStopOrder(CancelStopOrderRequest) returns (CancelStopOrderResponse);
  rpc GetStopOrders(GetStopOrdersRequest) returns (GetStopOrdersResponse);
  rpc StreamOrderStates(StreamOrderStatesRequest) returns (stream OrderStateEvent);
  rpc StreamTrades(StreamTradesRequest) returns (stream TradeEvent);
}

message PostOrderRequest {
  string account_id = 1;
  string instrument_uid = 2;
  int64 quantity = 3;
  github.com.24alert.trading.common.v1.OrderDirection direction = 4;
  string client_order_id = 5;                           // UUID, max 36 chars, idempotent
  github.com.24alert.trading.common.v1.OrderType order_type = 6;
  github.com.24alert.trading.common.v1.Quotation price = 7;  // for LIMIT orders
  github.com.24alert.trading.common.v1.OrderExecutionType execution_type = 8;
  map<string, string> metadata = 9;
}

message PostOrderResponse {
  string order_id = 1;
  github.com.24alert.trading.common.v1.OrderStatus status = 2;
  int64 filled_qty = 3;
  github.com.24alert.trading.common.v1.Quotation executed_price = 4;
  int64 created_at_us = 5;
  string message = 6;
}

message CancelOrderRequest {
  string account_id = 1;
  string order_id = 2;
}

message CancelOrderResponse {
  string order_id = 1;
  github.com.24alert.trading.common.v1.OrderStatus status = 2;
  int64 cancelled_at_us = 3;
}

message ReplaceOrderRequest {
  string account_id = 1;
  string order_id = 2;
  string new_client_order_id = 3;
  int64 quantity = 4;
  github.com.24alert.trading.common.v1.Quotation price = 5;
}

message GetOrdersRequest {
  string account_id = 1;
}

message GetOrdersResponse {
  repeated OrderState orders = 1;
}

message GetOrderStateRequest {
  string account_id = 1;
  string order_id = 2;
}

message OrderState {
  string order_id = 1;
  string account_id = 2;
  string instrument_uid = 3;
  github.com.24alert.trading.common.v1.OrderDirection direction = 4;
  int64 requested_qty = 5;
  int64 filled_qty = 6;
  github.com.24alert.trading.common.v1.OrderStatus status = 7;
  github.com.24alert.trading.common.v1.Quotation average_price = 8;
  github.com.24alert.trading.common.v1.Quotation initial_price = 9;
  int64 created_at_us = 10;
  int64 updated_at_us = 11;
  repeated ExecutionInfo fills = 12;
}

message ExecutionInfo {
  string execution_id = 1;
  int64 qty = 2;
  github.com.24alert.trading.common.v1.Quotation price = 3;
  int64 executed_at_us = 4;
}

message OrderStateEvent {
  OrderState order = 1;
  int64 subscription_id = 2;
}

message TradeEvent {
  string trade_id = 1;
  string order_id = 2;
  string account_id = 3;
  string instrument_uid = 4;
  int64 qty = 5;
  github.com.24alert.trading.common.v1.Quotation price = 6;
  int64 executed_at_us = 7;
  int64 subscription_id = 8;
}

message PostStopOrderRequest {
  string account_id = 1;
  string instrument_uid = 2;
  int64 quantity = 3;
  github.com.24alert.trading.common.v1.OrderDirection direction = 4;
  string client_order_id = 5;
  github.com.24alert.trading.common.v1.StopOrderType stop_type = 6;
  github.com.24alert.trading.common.v1.Quotation stop_price = 7;
  github.com.24alert.trading.common.v1.OrderType order_type = 8;  // market/limit
  github.com.24alert.trading.common.v1.Quotation price = 9;       // for limit
}

message PostStopOrderResponse {
  string stop_order_id = 1;
  github.com.24alert.trading.common.v1.OrderStatus status = 2;
  int64 created_at_us = 3;
}

message CancelStopOrderRequest {
  string account_id = 1;
  string stop_order_id = 2;
}

message CancelStopOrderResponse {
  string stop_order_id = 1;
  int64 cancelled_at_us = 2;
}

message GetStopOrdersRequest {
  string account_id = 1;
}

message StopOrderState {
  string stop_order_id = 1;
  string account_id = 2;
  string instrument_uid = 3;
  int64 quantity = 4;
  github.com.24alert.trading.common.v1.OrderDirection direction = 5;
  github.com.24alert.trading.common.v1.StopOrderType stop_type = 6;
  github.com.24alert.trading.common.v1.Quotation stop_price = 7;
  github.com.24alert.trading.common.v1.OrderStatus status = 8;
  int64 created_at_us = 9;
}

message GetStopOrdersResponse {
  repeated StopOrderState stop_orders = 1;
}

message StreamOrderStatesRequest {
  string account_id = 1;
}

message StreamTradesRequest {
  string account_id = 1;
}
