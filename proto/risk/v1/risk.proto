syntax = "proto3";

package alert24.trading.risk.v1;

option go_package = "github.com/24alert/trading-bot/gen/go/risk/v1";

import "common/v1/types.proto";

service RiskService {
  rpc ValidateOrderIntent(alert24.trading.common.v1.OrderIntent) returns (RiskResponse);
  rpc GetRiskStatus(GetRiskStatusRequest) returns (RiskStatus);
  rpc ResetCircuitBreaker(ResetCircuitBreakerRequest) returns (ResetCircuitBreakerResponse);
}

message GetRiskStatusRequest {
}

message RiskStatus {
  bool circuit_breaker_active = 1;
  int32 failure_count = 2;
  int64 cooldown_expires_at_us = 3;
  int32 active_positions_count = 4;
  alert24.trading.common.v1.Quotation margin_level = 5;
  bool margin_call_active = 6;
  int64 evaluated_at_us = 7;
}

message RiskResponse {
  bool approved = 1;
  string reason = 2;
  RiskCheckResult session_check = 3;
  RiskCheckResult balance_check = 4;
  RiskCheckResult position_limit_check = 5;
  RiskCheckResult circuit_breaker_check = 6;
  int64 evaluated_at_us = 7;
}

message RiskCheckResult {
  string check_name = 1;
  bool passed = 2;
  string message = 3;
}

message ResetCircuitBreakerRequest {
}

message ResetCircuitBreakerResponse {
  bool reset_successful = 1;
  RiskStatus current_status = 2;
}
