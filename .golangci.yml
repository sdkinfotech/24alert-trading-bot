linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - unused
    - misspell
    - gofmt
    - goimports

issues:
  exclude-dirs:
    - vendor
    - gen
  exclude-rules:
    # errcheck in *_test.go (e.g. concurrent tests) without editing test sources.
    - path: _test\.go$
      linters:
        - errcheck
